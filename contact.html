<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinkGoose</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class=" page-margins">
        <header>
            <nav class="nav-links">
                <a href="" class="logo">Pink <span class="goose-pink">Goose</span></a>
                <div class="nav-buttons-group">
                    <a class="nav-buttons" href="index.html">Home</a>
                    <a class="nav-buttons" href="learn.html">Learn</a>
                    <a class="nav-buttons" href="about.html">About</a>
                    <a class="nav-buttons" href="contact.html">Contact</a>   
                </div>
                <a class="login-button" href="">Login</a>
            </nav>
        </header>
        <main>
            <section class="contact-hero">
                <h2 class="contact-h2">What's your GOOSE idea?</h2>
                <h3 class="contact-h3">Let’s chat and see how we can help</h3>
                <div class="contact-options">
                    <a class="contact-card telegram-card" href="https://web.telegram.org/">
                        <img class="contact-icon" src="assets/telegram-icon.png" alt="Telegram icon">
                        <div class="contact-copy">
                            <h4 class="contact-label">Telegram</h4>
                            <p class="contact-handle">@superdao_team</p>
                        </div>
                    </a>
                    <a class="contact-card email-card" href="mailto:hello@superdao.co">
                        <img class="contact-icon" src="assets/@-icon.png" alt="Email icon">
                        <div class="contact-copy">
                            <h4 class="contact-label">Email</h4>
                            <p class="contact-handle">hello@superdao.co</p>
                        </div>
                    </a>
                </div>
            </section>
            <section>
                <form>
                    <div class="contact-form-div">
                        <h2 class="contact-form-h2">Send a post Goose</h2>
                        <input class="input-box" type="email" name="Email" placeholder="Your email" required>
                        <input class="input-box" type="text" name="Name" placeholder="Your name" required>
                        <textarea class="input-box" type="text" rows="10" cols="50" name="Your message" placeholder="Your message" required></textarea>
                        <select class="select-box" name="Goose color" id="Goose color" required>
                            <option value="" disabled selected>Choose a goose color</option>
                            <option value="Red">Red</option>
                            <option value="White">White</option>
                            <option value="Blue">Blue</option>
                            <option value="Black">Black</option>
                        </select>
                        <button class="submit-button send-button" type="submit">Send</button>
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <div class="footer-box">
                <nav class="nav-buttons-ft">
                    <a class="about-button-ft footer-button" href="about.html">About</a>
                    <a class="jobs-button-ft footer-button" href="">Jobs</a>
                    <a class="legal-button-ft footer-button" href="">Legal</a>
                </nav>
                <div class="socials">
                    <a class="x-img all-social-icons" href="https://x.com/"> <img src="assets/twitter-outline.png" alt="twitter icon"></a> 
                    <a class="msg-img all-social-icons" href="https://web.whatsapp.com/"> <img src="assets/message-outline.png" alt="messages icon"></a>
                    <a class="yt-img all-social-icons" href="https://www.youtube.com/"> <img src="assets/youtube-outline.png" alt="youtube icon"></a>
                    <a class="dc-img all-social-icons" href="https://discord.com/channels/@me"> <img src="assets/discord-outline.png" alt="discord icon"></a>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
